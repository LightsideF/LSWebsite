<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" role="img" aria-label="20+ years experience">
  <title>20+ years experience</title>
  <!-- Coral background -->
  <rect width="120" height="160" fill="#c0392b" rx="4"/>
  <!-- Top rule -->
  <line x1="16" y1="28" x2="104" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Bottom rule -->
  <line x1="16" y1="132" x2="104" y2="132" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- 20+ -->
  <text x="60" y="90" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="44" font-weight="700" fill="#ffffff">20+</text>
  <!-- YRS -->
  <text x="60" y="116" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="0.08em">YRS</text>
  <!-- EXPERIENCE -->
  <text x="60" y="148" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.65)" letter-spacing="0.06em">EXPERIENCE</text>
  <!-- LIGHTSIDE top label -->
  <text x="60" y="20" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="0.1em">LIGHTSIDE</text>
</svg>
