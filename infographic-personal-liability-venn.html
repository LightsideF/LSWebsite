<!-- LIGHTSIDE FINANCIAL — PERSONAL LIABILITY VENN DIAGRAM INFOGRAPHIC -->
<!-- Filename: infographic-personal-liability-venn.html -->
<!-- Embed into personal-liability.html at build stage -->
<!-- CSS prefix: plv- to avoid class collisions -->

<style>
*{box-sizing:border-box;}
.plv-wrap{font-family:'Lato',sans-serif;padding:1rem 0;}
.plv-inner{display:flex;gap:2rem;align-items:flex-start;}
.plv-left{flex:0 0 auto;width:100%;max-width:480px;}
.plv-right{flex:1 1 auto;min-width:220px;}
.plv-panel{background:#f7f8f9;border-left:4px solid #c0392b;border-radius:0 6px 6px 0;padding:1rem 1.25rem;min-height:120px;}
.plv-panel p{margin:0;font-size:14px;color:#3a3a3a;line-height:1.7;}
.plv-lbl{font-size:11px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.plv-default{font-size:13px;color:#888;font-style:italic;margin:0;}
.plv-pill{cursor:pointer;}
.plv-pill rect{transition:opacity 0.15s;}
.plv-pill:hover rect{opacity:0.82;}
.plv-clink{cursor:pointer;}
.plv-clink:hover text{opacity:0.65;}
svg.plv-svg{width:100%;display:block;}
@media(max-width:640px){
  .plv-inner{flex-direction:column;}
  .plv-left{max-width:100%;}
  .plv-panel{margin-top:1rem;}
}
</style>

    <div class="plv-right">

</div>

<script>
(function(){
  var plvContent={
    dla:{label:'Loan to Dir (DLA)',text:'When a director withdraws money from the company, the accountant records it as a loan — meaning it must be repaid. Many directors don\'t realise this. If a liquidator is appointed, recovering that balance is a statutory duty under the Insolvency Act 1986. It cannot be overlooked, regardless of whether the director was aware the account was overdrawn.'},
    exp:{label:'Expenses Recovery',text:'A liquidator reviews company expenditure as part of their investigation. Expenses that cannot be shown to be wholly for business purposes may be treated as personal drawings — and the director can face a demand to repay those sums. The liquidator\'s opening figure is a starting position, not a final one. Early advice before a liquidator is appointed can make a material difference to the outcome.'},
    pg:{label:'Personal Guarantee',text:'A <a href="business-personal-guarantees.html">personal guarantee</a> is a personal liability from the moment it is signed — not from the moment the business fails. The lender is not required to wait for the company to default before pursuing the guarantor. If you have signed one, the risk is already personal, regardless of how the business is performing.'},
    ban:{label:'Director Ban',text:'A director disqualification is a personal consequence of business conduct. Under the Company Directors Disqualification Act 1986, the Insolvency Service can apply to court to ban a director from acting in that role for up to 15 years. The investigation process is formal and the consequences are serious — but the outcome is not predetermined. We help directors understand their position and navigate the process.'},
    fraud:{label:'Fraud',text:'Where a director has obtained funds through misrepresentation — including Bounce Back Loans falsely claimed or misused — personal liability follows. The exposure can include repayment demands, civil recovery action, and in serious cases criminal proceedings. The position must be understood clearly and early.'},
    sole:{label:'Sole Trader',text:'A sole trader has no legal separation between business and personal finances. Unlike a limited company, there is no closing route that writes off business debts. Every liability — HMRC, suppliers, creditors — is personal from the outset and remains personal. The mechanisms available are different from those open to a company director. See our <a href="personal.html">Personal Debt</a> and <a href="personal-hmrc.html">Personal HMRC</a> channels for the right starting point.'}
  };
  document.querySelectorAll('.plv-pill').forEach(function(el){
    function activate(){
      var key=el.getAttribute('data-plvkey');
      document.getElementById('plv-default').style.display='none';
      var lbl=document.getElementById('plv-lbl');
      var txt=document.getElementById('plv-txt');
      lbl.textContent=plvContent[key].label;
      txt.innerHTML=plvContent[key].text;
      lbl.style.display='block';
      txt.style.display='block';
    }
    el.addEventListener('click',activate);
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}});
  });
  document.querySelectorAll('.plv-clink').forEach(function(el){
    el.addEventListener('keydown',function(e){if(e.key==='Enter'){var fn=el.getAttribute('onclick');if(fn)eval(fn);}});
  });
})();
function plvGoLink(slug){window.location.href='/'+slug;}
</script>
